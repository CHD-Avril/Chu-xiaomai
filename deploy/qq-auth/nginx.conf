# Include INSIDE the existing HTTPS server {} for chuxiaomai.cyou.
# Never put the backend sources, .env or credentials under an alias/root.
location ^~ /qq/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_set_header Host $host;
    proxy_set_header Origin $http_origin;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 5s;
    proxy_read_timeout 40s;
    proxy_cache off;
    proxy_intercept_errors on;
    error_page 502 504 =503 @qq_auth_unavailable;
    # Callback query strings contain one-use authorization codes.
    access_log off;
}

location @qq_auth_unavailable {
    default_type text/html;
    charset utf-8;
    add_header Cache-Control "no-store" always;
    return 503 '<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QQ 登录暂时不可用</title><h1>QQ 登录暂时不可用</h1><p>请稍后重试，你仍可以浏览歌单。</p><p><a href="/">返回点歌台</a></p></html>';
}
